services:
  db:
    image: ankane/pgvector:latest
    container_name: phap_luat_vector_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: phapluat_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - rag_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: phap_luat_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=phapluat_rag
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - rag_network

  frontend:
    build:
      context: ./frontend/rag_app
      dockerfile: Dockerfile
      # To set VITE_API_URL dynamically at build time, we can pass args, 
      # or just rely on Nginx reverse proxy /api/ to the backend service
    container_name: phap_luat_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  pgvector_data:

networks:
  rag_network:
    driver: bridge
